# Dependabot hält Go-Module und GitHub-Actions aktuell (WP-4.6). Wöchentlich, mit
# gebündelten PRs, damit Sicherheits-/Versions-Updates nicht schleichend veralten.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
